services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: vai_no_ru
      POSTGRES_PASSWORD: vai_no_ru
      POSTGRES_DB: vai_no_ru
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vai_no_ru"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
